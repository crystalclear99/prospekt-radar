name: Angebote aktualisieren

# Donnerstag 04:00 UTC = 06:00 Wiener Zeit (Sommer) bzw. 05:00 (Winter).
# AT-Flugblaetter starten meist Do/Fr -> einmal woechentlich reicht.
on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:        # erlaubt manuelles Ausloesen im Actions-Tab

permissions:
  contents: write           # zum Zurueckschreiben der Preishistorie
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pip install --quiet httpx

      - name: Tests (offline, muessen gruen sein)
        run: |
          set -e
          for t in test_discount test_quantity test_categories test_render \
                   test_billa test_penny test_marktguru \
                   test_marktguru_fixes test_resilience; do
            echo "--- $t"
            python "tests/$t.py"
          done

      - name: Angebote holen
        id: run
        run: |
          set +e
          python pipeline.py --plz "${{ vars.PLZ || '4652' }}" \
                             --min-pct "${{ vars.MIN_PCT || '30' }}"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # rc=2 heisst: Lauf lief durch, meldet aber ein Problem (z.B. eine
          # Quelle ohne Treffer). Dann trotzdem deployen, aber sichtbar warnen.
          if [ "$rc" = "2" ]; then
            echo "::warning::Lauf meldet ein Problem - Details im Log oben."
          elif [ "$rc" != "0" ]; then
            echo "::error::Lauf fehlgeschlagen (Code $rc)."
            exit "$rc"
          fi

      - name: Seite vorbereiten
        run: |
          set -e
          test -s out/angebote.html
          cp out/angebote.html out/index.html
          # Nicht in Suchmaschinen: die Liste ist fuer den privaten Kreis.
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          ls -lh out/

      # Veroeffentlichen kommt VOR der Buchhaltung: ein fehlgeschlagener
      # Historien-Push darf die Seite nicht blockieren.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      # Best effort. Schlaegt fehl, wenn origin/main zwischenzeitlich
      # weitergewandert ist (Re-run eines aelteren Commits, paralleler Push).
      # Dann nur warnen - die Historie holt der naechste regulaere Lauf nach.
      - name: Preishistorie zurueckschreiben
        continue-on-error: true
        run: |
          git config user.name "prospekt-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.jsonl data/last_run.json
          if git diff --staged --quiet; then
            echo "Historie unveraendert."
            exit 0
          fi
          git commit -m "Preishistorie: Lauf vom $(date +%F)"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::warning::Historie kollidiert mit origin/main (vermutlich ein Re-run) - uebersprungen. Die Seite wurde trotzdem veroeffentlicht."
            exit 0
          fi
          if ! git push origin HEAD:main; then
            echo "::warning::Historie konnte nicht gepusht werden - uebersprungen. Die Seite wurde trotzdem veroeffentlicht."
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
